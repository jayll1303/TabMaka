<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Double Wings (Upper & Lower) -->
  <g id="upper-wings">
    <ellipse cx="16" cy="22" rx="15" ry="5" transform="rotate(-15 16 22)" fill="#c7ecee" fill-opacity="0.85" stroke="#48dbfb" stroke-width="1.4"/>
    <ellipse cx="48" cy="22" rx="15" ry="5" transform="rotate(15 48 22)" fill="#c7ecee" fill-opacity="0.85" stroke="#48dbfb" stroke-width="1.4"/>
  </g>
  <g id="lower-wings">
    <ellipse cx="18" cy="30" rx="13" ry="4.5" transform="rotate(-30 18 30)" fill="#c7ecee" fill-opacity="0.85" stroke="#48dbfb" stroke-width="1.4"/>
    <ellipse cx="46" cy="30" rx="13" ry="4.5" transform="rotate(30 46 30)" fill="#c7ecee" fill-opacity="0.85" stroke="#48dbfb" stroke-width="1.4"/>
  </g>

  <!-- Long Slender Segmented Tail -->
  <path d="M 32 30 L 32 58" stroke="#00cec9" stroke-width="5" stroke-linecap="round"/>
  <path d="M 32 30 L 32 58" stroke="#0abde3" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Segment Rings -->
  <line x1="30" y1="36" x2="34" y2="36" stroke="#0097e6" stroke-width="1.5"/>
  <line x1="30" y1="42" x2="34" y2="42" stroke="#0097e6" stroke-width="1.5"/>
  <line x1="30" y1="48" x2="34" y2="48" stroke="#0097e6" stroke-width="1.5"/>
  <line x1="30.5" y1="54" x2="33.5" y2="54" stroke="#0097e6" stroke-width="1.5"/>

  <!-- Thorax -->
  <ellipse cx="32" cy="26" rx="6.5" ry="7" fill="#00d2d3" stroke="#01a3a4" stroke-width="1.8"/>

  <!-- Big Anime Eyes -->
  <!-- Left Eye -->
  <circle cx="27" cy="17" rx="5" ry="5" fill="#10ac84"/>
  <circle cx="27" cy="17" r="4" fill="#1dd1a1"/>
  <circle cx="25.5" cy="15.5" r="1.6" fill="#ffffff"/>

  <!-- Right Eye -->
  <circle cx="37" cy="17" rx="5" ry="5" fill="#10ac84"/>
  <circle cx="37" cy="17" r="4" fill="#1dd1a1"/>
  <circle cx="35.5" cy="15.5" r="1.6" fill="#ffffff"/>
</svg>
