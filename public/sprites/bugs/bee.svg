<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Bee Flutter Wings -->
  <g id="wings">
    <ellipse cx="22" cy="18" rx="10" ry="14" transform="rotate(-25 22 18)" fill="#dff9fb" fill-opacity="0.88" stroke="#7ed6df" stroke-width="1.8"/>
    <ellipse cx="42" cy="18" rx="10" ry="14" transform="rotate(25 42 18)" fill="#dff9fb" fill-opacity="0.88" stroke="#7ed6df" stroke-width="1.8"/>
  </g>

  <!-- Antennae -->
  <path d="M 28 16 Q 24 10 20 8 M 36 16 Q 40 10 44 8" fill="none" stroke="#2d3436" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="19" cy="8" r="2" fill="#2d3436"/>
  <circle cx="45" cy="8" r="2" fill="#2d3436"/>

  <!-- Little Stinger -->
  <polygon points="32,58 29,52 35,52" fill="#2d3436"/>

  <!-- Chubby Striped Bee Body -->
  <g id="body">
    <!-- Base Yellow Oval -->
    <ellipse cx="32" cy="36" rx="15" ry="17" fill="#fbc531" stroke="#2d3436" stroke-width="2"/>
    <!-- Black Stripes -->
    <!-- Clip to body -->
    <path d="M 18 30 Q 32 34 46 30 L 47 36 Q 32 40 17 36 Z" fill="#2d3436"/>
    <path d="M 19 42 Q 32 46 45 42 L 44 48 Q 32 52 20 48 Z" fill="#2d3436"/>
  </g>

  <!-- Kawaii Face on Top Stripe -->
  <!-- Cute Eyes -->
  <circle cx="26" cy="24" r="3.2" fill="#2d3436"/>
  <circle cx="25" cy="23" r="1.2" fill="#ffffff"/>
  <circle cx="38" cy="24" r="3.2" fill="#2d3436"/>
  <circle cx="37" cy="23" r="1.2" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <circle cx="21" cy="27" r="2.2" fill="#ff7675" opacity="0.85"/>
  <circle cx="43" cy="27" r="2.2" fill="#ff7675" opacity="0.85"/>

  <!-- Tiny Smile -->
  <path d="M 30 27 Q 32 29 34 27" fill="none" stroke="#2d3436" stroke-width="1.5" stroke-linecap="round"/>
</svg>
