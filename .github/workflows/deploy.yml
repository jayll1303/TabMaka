name: Publish to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch: # Cho phép bấm chạy thủ công từ tab Actions

jobs:
  build-and-publish:
    name: Build & Publish Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Extension
        run: npm run build

      - name: Pack Extension (Zip)
        run: |
          cd dist
          zip -r ../tabmaka-${{ github.ref_name }}.zip ./*
          cd ..

      - name: Upload Zip to Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: tabmaka-${{ github.ref_name }}.zip

      - name: Upload & Submit to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-name: tabmaka-${{ github.ref_name }}.zip
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          deploy: true # Tự động submit review bản mới lên Web Store
