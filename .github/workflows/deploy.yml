name: Publish to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch: # Cho phép bấm chạy thủ công từ tab Actions

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Extension
        run: npm run build

      - name: Pack Extension (Zip)
        id: pack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP_NAME="tabmaka-v${VERSION}.zip"
          cd dist
          zip -r "../${ZIP_NAME}" ./*
          cd ..
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Zip to Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.pack.outputs.zip_name }}

      - name: Upload & Submit to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ${{ steps.pack.outputs.zip_name }}
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true
