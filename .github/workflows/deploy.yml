name: Publish to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_web_store:
        description: "Upload and submit the current main build to Chrome Web Store"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Extension
        run: npm run build

      - name: Pack Extension (Zip)
        id: pack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP_NAME="pondie-tab-v${VERSION}.zip"
          cd dist
          zip -r "../${ZIP_NAME}" ./*
          cd ..
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Zip to Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.pack.outputs.zip_name }}

      - name: Chrome Web Store publishing is manual
        if: github.event_name == 'release'
        run: |
          {
            echo "## Chrome Web Store"
            echo "GitHub Release was created successfully."
            echo "To submit this build to Chrome Web Store, run this workflow manually with \`publish_to_web_store\` enabled."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload & Submit to Chrome Web Store
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_to_web_store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: ${{ steps.pack.outputs.zip_name }}
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true
