<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TabMaka - Cozy new tab pet for Chrome and Edge" />
    <meta name="theme-color" content="#121824" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>TabMaka - Cozy New Tab Pet</title>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <!-- Top-Left 3-State Clock Toggle -->
    <div id="clock-control"></div>

    <main id="stage">
      <div id="companion" role="img" aria-label="An interactive companion that follows your cursor"></div>
      <div id="greeting"></div>
      <div id="clock" aria-live="polite"></div>
    </main>

    <!-- Bottom-Left Ambient Color Bar -->
    <div id="ambient-palette"></div>
    <div id="onboarding" hidden>
      <p>Meet your companion. It follows your cursor and wanders when you are away. Click anywhere to begin.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
